[project]
name = "scout"
version = "0.1.0"
description = "만들고 싶은 소프트웨어를 한 줄로 설명하면 근거와 함께 답하는 CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core",
    "langchain-aws",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-mcp-adapters",
    "pydantic",
    "pydantic-settings",
    "typer",
    "boto3",
    "jinja2",
]

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "scout는 인터넷에 직접 나가지 않는다 — mcp_client를 쓴다"
"requests".msg = "동일"
"urllib.request".msg = "동일"
