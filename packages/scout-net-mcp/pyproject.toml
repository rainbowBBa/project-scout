[project]
name = "scout-net-mcp"
version = "0.1.0"
description = "project-scout의 유일한 인터넷 출구 — MCP 서버"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp",
    "httpx",
    "pydantic-settings",
    "ddgs",
]

[project.scripts]
scout-net-mcp = "scout_net_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_net_mcp"]
