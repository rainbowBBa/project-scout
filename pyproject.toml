[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
include = ["packages/**/*.py"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]

[tool.ty]

[tool.ty.src]
include = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["ruff", "ty", "pytest", "pytest-asyncio"]
